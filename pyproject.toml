[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "net-inspection-cv"
version = "0.1.0"
description = "Prototype computer-vision toolkit for aquaculture net damage detection"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Prototype author" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
# Classical baseline, visualisation, and video need OpenCV + matplotlib.
cv = ["opencv-python-headless>=4.8", "matplotlib>=3.7", "scikit-image>=0.21", "scikit-learn>=1.3"]
# ML baseline (YOLO) + foundation-model anomaly (PatchCore uses torchvision backbones).
ml = ["ultralytics>=8.1", "torch>=2.0", "torchvision>=0.15", "scikit-learn>=1.3"]
# Real-data ingestion (SOLAQUA ROS .bag reading, no ROS install needed) +
# telemetry persistence (parquet).
data = ["rosbags>=0.9", "pyarrow>=14.0"]
# Grounded inspection assistant (tool-calling Q&A over the repo's artifacts)
# and the local reporting warehouse it queries.
assistant = ["anthropic>=0.60", "duckdb>=1.0", "pyarrow>=14.0"]
# Serving + interactive viewer + web console.
serve = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9",
         "streamlit>=1.33", "httpx>=0.27"]
# ONNX export + portable inference (deployment hand-off).
export = ["onnx>=1.15", "onnxruntime>=1.17", "onnxslim>=0.1"]
dev = ["pytest>=7.4", "pytest-cov>=5.0", "ruff>=0.6", "pre-commit>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["outputs", ".venv", "runs", "web", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
# E402: CLI scripts intentionally set sys.path (via `import _common`) before
# importing the package. E501: long lines tolerated in docstrings/tables.
# E701/E702: compact one-line statements are allowed (mostly in tests).
ignore = ["E402", "E501", "E701", "E702"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["F401"]      # `import _common` is for its sys.path side effect
"tests/*" = ["F401"]
"src/netinspect/__init__.py" = ["F401"]
"streamlit_app.py" = ["F401"]
