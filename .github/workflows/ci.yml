name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v1
        with:
          args: "check src scripts tests streamlit_app.py"

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (core + cv + dev)
        run: |
          python -m pip install --upgrade pip
          # cv extra covers the classical baseline, anomaly model, visualisation.
          # ultralytics/torch and rosbags are NOT needed for the test suite
          # (no test trains YOLO or reads a .bag), keeping CI fast.
          pip install -e ".[cv,dev]"

      - name: Run tests
        run: pytest -q
