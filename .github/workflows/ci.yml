name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v4
        with:
          args: "check src scripts tests streamlit_app.py"

  # Fast path: the core library on every supported Python. The cv extra covers
  # the classical baseline, anomaly model and visualisation. torch/ultralytics
  # are deliberately excluded — no test trains a model — which keeps this job
  # to a few minutes.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (core + cv + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[cv,dev]"

      - name: Run tests
        run: pytest -q

  # Wider path: adds the data (rosbags, pyarrow) and assistant (duckdb,
  # anthropic) extras so the telemetry, warehouse and assistant import paths are
  # exercised rather than skipped. Without this job those modules are only ever
  # collected, never imported under their real dependencies — which is how an
  # optional-dependency break reaches main unnoticed.
  #
  # No API key is needed: every assistant test is offline by construction. The
  # guard that matters (refusing to answer past the evidence) is deterministic
  # code, not model behaviour, and is tested as such.
  test-extras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install (core + cv + data + assistant + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[cv,data,assistant,dev]"
          pip install pytest-cov

      - name: Run tests with coverage
        # The floor sits below the current figure rather than at it: this is a
        # regression guard, not a target to game. Large uncovered blocks are the
        # torch- and bag-dependent paths, which no CI job installs.
        run: pytest -q --cov=netinspect --cov-report=term-missing --cov-fail-under=55

  # The figures and result tables in the README are generated, so a change that
  # silently breaks generation should fail here rather than at read time.
  figures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install (core + cv + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[cv,dev]"

      - name: Figure scripts are importable and self-describing
        run: |
          for f in scripts/make_evidence_figure.py scripts/make_planning_figure.py \
                   scripts/make_failure_figure.py; do
            python "$f" --help > /dev/null || exit 1
          done

      - name: Every image referenced by the README exists
        run: |
          python - <<'PY'
          import pathlib, re, sys
          readme = pathlib.Path("README.md").read_text(encoding="utf-8")
          missing = [m for m in re.findall(r"\]\((docs/images/[^)]+)\)", readme)
                     if not pathlib.Path(m).exists()]
          if missing:
              print("README references missing images:", *missing, sep="\n  ")
              sys.exit(1)
          print("all README images present")
          PY
